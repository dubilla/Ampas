name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  specs:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      # config/database.yml specifies no host or credentials, so point libpq at
      # the service container through its own environment variables rather than
      # editing the checked-in config.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler: '2.5.23'
          bundler-cache: true

      - name: Load schema
        # Schema format is :sql, so db:schema:load reads db/structure.sql.
        # db:structure:load was removed in Rails 7.1.
        run: bundle exec rake db:create db:schema:load

      - name: Run specs
        run: bundle exec rspec
