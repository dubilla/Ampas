inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  Exclude:
    - bin/**/*
    - db/schema.rb
    - db/structure.sql
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - config/environments/**/*
    - spec/**/*
